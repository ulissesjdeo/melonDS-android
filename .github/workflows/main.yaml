# This is a basic workflow to help you get started with Actions

name: melonDS Android Nightly Build

# Controls when the action will run.
on:
  # Triggers the workflow on push to any branch
  push:
    branches: [ '**' ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:

      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: zulu
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Configure release signing
        id: signing
        env:
          MELONDS_KEYSTORE: ${{ secrets.MELONDS_KEYSTORE }}
          MELONDS_KEYSTORE_PASSWORD: ${{ secrets.MELONDS_KEYSTORE_PASSWORD }}
        run: |
          if [[ -z "$MELONDS_KEYSTORE" || -z "$MELONDS_KEYSTORE_PASSWORD" ]]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Signing secrets are unavailable; building an unsigned nightly APK without publishing a release."
            exit 0
          fi

          KEYSTORE_PATH="${{ runner.workspace }}/keystore.jks"
          if ! printf '%s' "$MELONDS_KEYSTORE" | base64 --decode > "$KEYSTORE_PATH" || \
             ! keytool -list \
               -keystore "$KEYSTORE_PATH" \
               -storepass "$MELONDS_KEYSTORE_PASSWORD" \
               -alias melonds > /dev/null 2>&1; then
            rm -f "$KEYSTORE_PATH"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Signing secrets do not contain a usable melonds key; building an unsigned nightly APK without publishing a release."
            exit 0
          fi

          {
            echo "MELONDS_KEYSTORE=$KEYSTORE_PATH"
            echo "MELONDS_KEYSTORE_PASSWORD=$MELONDS_KEYSTORE_PASSWORD"
            echo "MELONDS_KEY_ALIAS=melonds"
            echo "MELONDS_KEY_PASSWORD=$MELONDS_KEYSTORE_PASSWORD"
          } >> local.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build melonDS Android
        run: |
          COMMIT=$(git rev-parse --short HEAD)
          VERSION=$(grep '^melonDS.versionName=' gradle.properties | cut -d= -f2-)
          chmod +x ./gradlew
          ./gradlew :app:assembleGitHubNightlyRelease "-PmelonDS.versionName=$VERSION ($COMMIT)" -PmelonDS.abis=armeabi-v7a,arm64-v8a,x86_64

      - name: Update nightly tag
        if: steps.signing.outputs.signed == 'true'
        run: |
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git tag -m "Nightly Release" -f -a nightly-release
          git push -f origin refs/tags/nightly-release

      - name: Update GitHub Nightly Release
        if: steps.signing.outputs.signed == 'true'
        id: update_release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          prerelease: true
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: nightly-release
          name: 'Nightly Build'
          body: 'The currently Nightly Build. Whenever new changes are pushed, you can find the latest build here. You can keep this installation alongside your main one.'
          artifacts: app/build/outputs/apk/gitHubNightly/release/app-gitHub-nightly-release.apk
          artifactContentType: application/vnd.android.package-archive

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: melonDS-android
          path: app/build/outputs/apk/gitHubNightly/release/*.apk
